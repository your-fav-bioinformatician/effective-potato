name: unibridge_frontend
description: A Modern Major Recommender App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # Networking
  http: ^1.1.0
  
  # State Management
  provider: ^6.0.5
  
  # UI/UX
  google_fonts: ^6.1.0
  flutter_animate: ^4.2.0
  
  # Utils
  intl: ^0.20.2
  shared_preferences: ^2.2.1
  
  # Location & Links
  geolocator: ^13.0.2
  url_launcher: ^6.2.0 # REQUIRED FOR MBTI LINK

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true